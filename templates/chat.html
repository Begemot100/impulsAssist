<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alina</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <style>
        #loadingSpinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid #ccc;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
       <div id="chat-messages">
          {% for message in chat_history %}
            {% if message.role != 'system' %}
              <div class="chat-bubble {% if message.role == 'user' %}user{% else %}assistant{% endif %}">
                {{ message.content }}
              </div>
            {% endif %}
          {% endfor %}
        </div>



        <form id="chat-form" class="chat-form" onsubmit="sendMessage(event)">
            <input type="text" id="userInput" name="message" placeholder="Введите сообщение..." autocomplete="off" required>
            <button type="submit" id="sendButton">➤</button>
            <div id="loadingSpinner"></div>
        </form>
    </div>

    <script>
        async function sendMessage(event) {
            event.preventDefault();

            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            if (!message) return;

            const chatMessages = document.getElementById('chat-messages');

            // Отображаем сообщение пользователя сразу
            const userDiv = document.createElement('div');
            userDiv.className = 'user-message';
            userDiv.innerText = message;
            chatMessages.appendChild(userDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            userInput.value = '';
            document.getElementById('sendButton').style.display = 'none';
            document.getElementById('loadingSpinner').style.display = 'inline-block';

            try {
                const response = await fetch('/send_message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'message=' + encodeURIComponent(message)
                });

                const data = await response.json();

                // Отображаем ответ ассистента
                const assistantDiv = document.createElement('div');
                assistantDiv.className = 'assistant-message';
                assistantDiv.innerText = data.assistant_reply;
                chatMessages.appendChild(assistantDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка отправки сообщения.');
            } finally {
                document.getElementById('sendButton').style.display = 'inline-block';
                document.getElementById('loadingSpinner').style.display = 'none';
            }
        }

        window.onload = () => {
            const chat = document.getElementById('chat-messages');
            chat.scrollTop = chat.scrollHeight;
        };
    </script>
</body>
</html>
