<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alina</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <style>
        /* Спиннер загрузки */
        #loadingSpinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid #ccc;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div id="chat-messages">
            {% for message in chat_history %}
                <div class="{% if message.role == 'user' %}user-message{% else %}assistant-message{% endif %}">
                    {{ message.content }}
                </div>
            {% endfor %}
        </div>

        <form id="chat-form" class="chat-form" onsubmit="sendMessage(event)">
            <input type="text" id="userInput" name="message" placeholder="Введите сообщение..." autocomplete="off" required>
            <button type="submit" id="sendButton">➤</button>
            <div id="loadingSpinner"></div>
        </form>
    </div>

    <script>
        async function sendMessage(event) {
            event.preventDefault(); // Остановить отправку формы

            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();

            if (message === '') return;

            // Прячем кнопку, показываем спиннер
            document.getElementById('sendButton').style.display = 'none';
            document.getElementById('loadingSpinner').style.display = 'inline-block';

            // Добавляем сообщение пользователя сразу на страницу
            const chatMessages = document.getElementById('chat-messages');
            const userDiv = document.createElement('div');
            userDiv.className = 'user-message';
            userDiv.innerText = message;
            chatMessages.appendChild(userDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            userInput.value = '';

            // Отправляем сообщение на сервер
            try {
                const response = await fetch('/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'message=' + encodeURIComponent(message)
                });

                if (response.ok) {
                    const text = await response.text();
                    // Перезагружаем страницу, чтобы получить ответ ассистента
                    document.open();
                    document.write(text);
                    document.close();
                } else {
                    alert('Ошибка при отправке сообщения.');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка отправки.');
            } finally {
                document.getElementById('sendButton').style.display = 'inline-block';
                document.getElementById('loadingSpinner').style.display = 'none';
            }
        }

        // При загрузке страницы прокручивать вниз
        window.onload = () => {
            const chat = document.getElementById('chat-messages');
            chat.scrollTop = chat.scrollHeight;
        };
    </script>
</body>
</html>
